[package]
name = "targetsweeper"
version = "0.1.0"
edition = "2024"
description = "Find Cargo target directories on the fixed drives and delete them, with explicit confirmation"

[dependencies]
# xui main with the ListView/StatusBar arrange support (va1erian/xui#181,
# merged as xui commit ec94d60).
xui-core = { git = "https://github.com/va1erian/xui", rev = "ec94d605258be5bd19abe876fccd285091c05fdb" }
xui-win32 = { git = "https://github.com/va1erian/xui", rev = "ec94d605258be5bd19abe876fccd285091c05fdb" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# The same `windows` version xui-win32 uses.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }
