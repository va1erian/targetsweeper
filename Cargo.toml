[package]
name = "targetsweeper"
version = "0.3.0"
edition = "2024"
description = "Find Cargo target directories on the fixed drives and delete them, with explicit confirmation"

[dependencies]
# Pinned to xui main (ListView/StatusBar arrange support from va1erian/xui#181
# plus everything since).
xui-core = { git = "https://github.com/va1erian/xui", rev = "85db16f74e8ad9ed50e264babeece3d9978bb8bf" }
xui-win32 = { git = "https://github.com/va1erian/xui", rev = "85db16f74e8ad9ed50e264babeece3d9978bb8bf" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# The same `windows` version xui-win32 uses.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Embeds app.rc (the application icon) into the executable.
embed-resource = "3.0"

[profile.release]
# The app ships as a single portable exe: optimize for size, strip it, and
# abort instead of unwinding (there is no unwinding to do in a GUI app).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
