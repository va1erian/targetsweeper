name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "tag $tag does not match Cargo.toml version v$version"
          }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/targetsweeper.exe targetsweeper.exe
          $hash = (Get-FileHash targetsweeper.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("targetsweeper.exe.sha256", "$hash  targetsweeper.exe`n", [System.Text.UTF8Encoding]::new($false))
      - name: Upload the release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            targetsweeper.exe
            targetsweeper.exe.sha256

  publish:
    name: Publish (Windows)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          # A release for the tag may already exist (created by hand or by an
          # earlier run); re-runs must refresh its assets, not fail.
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag targetsweeper.exe targetsweeper.exe.sha256 --repo $repo --title $tag --generate-notes
            exit $LASTEXITCODE
          }

          Write-Host "release $tag already exists; replacing its assets"
          # `gh release upload --clobber` deletes an asset before uploading its
          # replacement, so keep the currently published files and restore
          # them if the replacement upload fails.
          $backup = Join-Path $env:RUNNER_TEMP "previous-assets"
          New-Item -ItemType Directory -Force -Path $backup | Out-Null
          gh release download $tag --repo $repo --pattern "targetsweeper.exe*" --dir $backup --clobber *> $null
          $previous = @(Get-ChildItem -Path $backup -File -ErrorAction SilentlyContinue)

          gh release upload $tag targetsweeper.exe targetsweeper.exe.sha256 --repo $repo --clobber
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }
          if ($previous.Count -gt 0) {
            Write-Host "asset upload failed; restoring the previously published assets"
            gh release upload $tag $previous.FullName --repo $repo --clobber
          }
          exit 1
