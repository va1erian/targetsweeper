name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "tag $tag does not match Cargo.toml version v$version"
          }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/targetsweeper.exe targetsweeper.exe
          $hash = (Get-FileHash targetsweeper.exe -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("targetsweeper.exe.sha256", "$hash  targetsweeper.exe`n", [System.Text.UTF8Encoding]::new($false))
      - name: Upload the release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            targetsweeper.exe
            targetsweeper.exe.sha256

  publish:
    name: Publish (Windows)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" targetsweeper.exe targetsweeper.exe.sha256 --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
