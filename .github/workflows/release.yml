name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "tag $tag does not match Cargo.toml version v$version"
          }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/targetsweeper.exe targetsweeper.exe
          $hash = (Get-FileHash targetsweeper.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  targetsweeper.exe" | Set-Content targetsweeper.exe.sha256
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" targetsweeper.exe targetsweeper.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
